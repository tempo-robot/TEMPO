camera_brightness:
  observation.images.left_wrist: 15.0
  observation.images.right_wrist: 12.0

motion_dir: /scratch/dfeng8/sam2_uvt_cache/motion_diff_first_last_v2v7
motion_dim: 256

output_dir: /srv/disk00/dfeng8/work/dynamics/outputs/train/pi05_motion_dyn_handover_v2v7_chunk16
job_name: pi05_motion_dyn_handover_v2v7_chunk16

shared_observation: true
max_delay_steps: 8

batch_size: 11
grad_accum_steps: 2
steps: 10000
num_workers: 4
seed: 1000

use_policy_training_preset: false
optimizer:
  type: adamw
  lr: 5.0e-5
  betas: [0.9, 0.95]
  weight_decay: 1.0e-10

scheduler:
  type: cosine_decay_with_warmup
  num_warmup_steps: 1000
  peak_lr: 5.0e-5
  decay_lr: 2.5e-6
  num_decay_steps: 10000

save_checkpoint: true
save_freq: 1000

log_freq: 100
wandb:
  enable: true
  project: vlash
  entity: null
  disable_artifact: true
